name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run --frozen pytest
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "26"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: node --check bot/static/app.js
      - run: node --check bot/static/research.js
      - run: uv build --no-sources
