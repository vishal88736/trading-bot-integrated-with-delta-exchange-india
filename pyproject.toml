[build-system]
requires = ["hatchling>=1.33,<2"]
build-backend = "hatchling.build"

[project]
name = "delta-india-trading-bot"
version = "0.1.0"
description = "Configurable candle-close strategies for Delta Exchange India"
requires-python = ">=3.12,<3.15"
dependencies = [
  "requests>=2.34.2,<3",
  "python-dotenv>=1.2.4,<2",
  "filelock>=4.2.9,<5",
  "fastapi>=0.162.2,<0.163",
  "uvicorn>=0.54,<0.55",
]

[project.scripts]
delta-bot = "bot.cli:main"

[dependency-groups]
dev = ["pytest>=9.2,<10", "ruff>=0.17.4,<0.18", "httpx>=0.28.1,<0.29"]

[tool.hatch.build.targets.wheel]
packages = ["bot", "clients", "strategies"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
